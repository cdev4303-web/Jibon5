name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Bangla Calendar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Android APK (Debug)
        if: "${{ github.event.inputs.build_type != 'release' }}"
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android APK (Release Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organize Output Artifacts
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/Bangla-Calendar-v1.0-debug.apk
            echo "Debug APK ready at output/Bangla-Calendar-v1.0-debug.apk"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/Bangla-Calendar-v1.0-release-unsigned.apk
            echo "Release APK ready at output/Bangla-Calendar-v1.0-release-unsigned.apk"
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Calendar-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          name: "বাংলা ক্যালেন্ডার Android রিলিজ ${{ github.ref_name }}"
          generate_release_notes: true
